name: build apk

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }

      - name: pasang alat
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq aapt apksigner

      - name: unduh bahan
        run: |
          mkdir -p dl
          curl -sL -o dl/platform-34.zip "https://dl.google.com/android/repository/platform-34-ext7_r02.zip"
          unzip -oq dl/platform-34.zip "*/android.jar" -d dl/
          curl -sL -o dl/oc-musl.tgz "https://registry.npmjs.org/opencode-linux-arm64-musl/-/opencode-linux-arm64-musl-1.18.21.tgz"
          curl -sL -o dl/minirootfs.tar.gz "https://dl-cdn.alpinelinux.org/alpine/v3.21/releases/aarch64/alpine-minirootfs-3.21.3-aarch64.tar.gz"
          curl -sL -o dl/libgcc.apk "https://dl-cdn.alpinelinux.org/alpine/v3.21/main/aarch64/libgcc-14.2.0-r4.apk"
          curl -sL -o dl/libstdc.apk "https://dl-cdn.alpinelinux.org/alpine/v3.21/main/aarch64/libstdc%2B%2B-14.2.0-r4.apk"

      - name: unduh proot (termux aarch64)
        run: |
          mkdir -p dl/termux && cd dl/termux
          for pkg in proot libtalloc libandroid-shmem; do
            url=$(curl -sL "https://packages.termux.dev/apt/termux-main/dists/stable/main/binary-aarch64/Packages" | grep -A2 "Package: ${pkg}$" | grep Filename | head -1 | cut -d' ' -f2)
            curl -sL -O "https://packages.termux.dev/apt/termux-main/${url}"
          done
          ls

      - name: rakit payload + jniLibs
        run: |
          mkdir -p staging/rootfs staging/apks assets/payload jniLibs/arm64-v8a
          tar -xzf dl/minirootfs.tar.gz -C staging/rootfs
          tar -xzf dl/oc-musl.tgz -C staging/
          cp staging/package/bin/opencode jniLibs/arm64-v8a/libopencode.so
          mv dl/libgcc.apk staging/apks/ && mv dl/libstdc.apk staging/apks/
          tar -xzf staging/apks/libgcc.apk -C staging/apks/ || true
          tar -xzf staging/apks/libstdc.apk -C staging/apks/ || true
          cp -a staging/apks/usr/lib/. staging/rootfs/usr/lib/
          printf "nameserver 1.1.1.1\nnameserver 8.8.8.8\n" > staging/rootfs/etc/resolv.conf
          mkdir -p staging/rootfs/root/.config/opencode staging/rootfs/work staging/rootfs/tmp
          printf '#!/bin/sh\nexport HOME=/root TMPDIR=/tmp XDG_CONFIG_HOME=/root/.config\nexec /usr/bin/opencode "$@"\n' > staging/rootfs/usr/bin/oc
          chmod +x staging/rootfs/usr/bin/oc
          printf '{\n  "$schema": "https://opencode.ai/config.json",\n  "model": "opencode/x-preview-f-free"\n}\n' > staging/rootfs/root/.config/opencode/opencode.json
          tar -czf assets/payload/rootfs.bin -C staging/rootfs .
          cd dl/termux
          for d in *.deb; do dpkg-deb -x "$d" ex; done
          find ex -name "libtalloc.so*" -exec cp {} ../../jniLibs/arm64-v8a/libtalloc.so \;
          find ex -name "libandroid-shmem.so*" -exec cp {} ../../jniLibs/arm64-v8a/libshmem.so \;
          find ex -name "proot" -type f -exec cp {} ../../jniLibs/arm64-v8a/libproot.so \;
          find ex -path "*libexec/proot/loader" -exec cp {} ../../jniLibs/arm64-v8a/libproot_loader.so \;
          cd ../..

      - name: build
        run: |
          sed -i 's|\$PREFIX/bin/proot|jniLibs/arm64-v8a/libproot.so|' build.sh || true
          bash build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: OpenCode-APK
          path: build/*.apk

      - name: release (tag saja)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.apk
