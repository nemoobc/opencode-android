name: tes emulator (manual)

on:
  workflow_dispatch:

jobs:

  test-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install jsdom --no-fund --no-audit
      - run: node test/ui.test.js

  build-x86:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: alat
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq aapt apksigner unzip curl
          curl -sL -o r8.jar "https://dl.google.com/dl/android/maven2/com/android/tools/r8/8.5.35/r8-8.5.35.jar"
          echo "D8_CMD=java -cp $PWD/r8.jar com.android.tools.r8.D8" >> $GITHUB_ENV
      - name: unduh bahan x86_64
        run: |
          mkdir -p dl
          curl -sL -o dl/platform-34.zip "https://dl.google.com/android/repository/platform-34-ext7_r02.zip"
          unzip -oq dl/platform-34.zip "*/android.jar" -d dl/
          curl -sL -o dl/oc.tgz "https://registry.npmjs.org/opencode-linux-x64-musl/-/opencode-linux-x64-musl-1.18.25.tgz"
          curl -sL -o dl/minirootfs.tar.gz "https://dl-cdn.alpinelinux.org/alpine/v3.21/releases/x86_64/alpine-minirootfs-3.21.3-x86_64.tar.gz"
          curl -sL -o dl/libgcc.apk "https://dl-cdn.alpinelinux.org/alpine/v3.21/main/x86_64/libgcc-14.2.0-r4.apk"
          curl -sL -o dl/libstdc.apk "https://dl-cdn.alpinelinux.org/alpine/v3.21/main/x86_64/libstdc%2B%2B-14.2.0-r4.apk"
      - name: unduh proot termux x86_64
        run: |
          mkdir -p dl/termux && cd dl/termux
          curl -sL -o Packages "https://packages.termux.dev/apt/termux-main/dists/stable/main/binary-x86_64/Packages"
          for pkg in proot libtalloc libandroid-shmem; do
            url=$(awk -v p="Package: $pkg" '$0==p{f=1} f&&/^Filename:/{print $2; exit}' Packages)
            echo "pkg $pkg -> $url"
            curl -sL -O "https://packages.termux.dev/apt/termux-main/${url}"
          done
          for d in *.deb; do dpkg-deb -x "$d" ex; done
          find ex -name "proot" -type f -exec cp {} ./proot.bin \;
          find ex -path "*libexec/proot/loader" -exec cp {} ./loader.bin \;
          find ex -name "libtalloc.so*" -exec cp {} ./libtalloc.so \;
          find ex -name "libandroid-shmem.so*" -exec cp {} ./libshmem.so \;
          ls -la
      - name: rakit payload + jniLibs x86_64
        run: |
          mkdir -p staging/rootfs staging/apks assets/payload jniLibs/x86_64
          tar -xzf dl/minirootfs.tar.gz -C staging/rootfs
          tar -xzf dl/oc.tgz -C staging/
          cp staging/package/bin/opencode jniLibs/x86_64/libopencode.so
          mv dl/libgcc.apk dl/libstdc.apk staging/apks/
          tar -xzf staging/apks/libgcc.apk -C staging/apks/ || true
          tar -xzf staging/apks/libstdc.apk -C staging/apks/ || true
          cp -a staging/apks/usr/lib/. staging/rootfs/usr/lib/
          printf "nameserver 1.1.1.1\nnameserver 8.8.8.8\n" > staging/rootfs/etc/resolv.conf
          mkdir -p staging/rootfs/root/.config/opencode staging/rootfs/tmp
          printf '#!/bin/sh\nexport HOME=/root TMPDIR=/tmp XDG_CONFIG_HOME=/root/.config\nexec /usr/bin/opencode "$@"\n' > staging/rootfs/usr/bin/oc
          chmod +x staging/rootfs/usr/bin/oc
          python3 -c "
import json
cfg = {'\$schema': 'https://opencode.ai/config.json',
       'provider': {'zen': {'npm': '@ai-sdk/openai-compatible', 'name': 'Zen',
                     'options': {'baseURL': 'https://opencode.ai/zen/v1'},
                     'models': {'big-pickle': {}, 'x-preview-f-free': {}}}},
       'model': 'zen/big-pickle'}
with open('staging/rootfs/root/.config/opencode/opencode.json','w') as f:
    json.dump(cfg, f, indent=2)
"
          tar -czf assets/payload/rootfs.bin -C staging/rootfs .
          cp dl/termux/proot.bin jniLibs/x86_64/libproot.so
          cp dl/termux/loader.bin jniLibs/x86_64/libproot_loader.so
          cp dl/termux/libtalloc.so jniLibs/x86_64/libtalloc.so
          cp dl/termux/libshmem.so jniLibs/x86_64/libshmem.so
      - name: build apk x86_64
        run: |
          OCX_ABI=x86_64 bash build.sh
          mkdir -p out
          mv build/OpenCode-*.apk out/app-x86.apk
      - name: verifikasi arsc uncompressed
        run: |
          unzip -v out/app-x86.apk | grep resources.arsc | grep -q "Stored" && echo "arsc STORED OK" || (echo "arsc TERKOMPRESI!" && exit 1)
          unzip -v out/app-x86.apk | grep -E '\.so$' | grep -q "Stored" && echo ".so STORED OK" || echo ".so warn: compressed"
      - uses: actions/upload-artifact@v4
        with: { name: apk-x86, path: out/app-x86.apk }

  emulator:
    needs: build-x86
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: apk-x86, path: . }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - name: adb start-server
        run: adb start-server
      - name: emulator + autotest
        timeout-minutes: 60
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: false
          script: |
            adb wait-for-device || true
            echo "=== menunggu boot tuntas (maks 12 menit) ==="
            i=0; while [ $i -lt 144 ]; do B=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r'); [ "$B" = "1" ] && echo "boot flag OK" && break; sleep 5; i=$((i+1)); done
            echo "=== menunggu service package hidup (fungsi) ==="
            i=0; while [ $i -lt 60 ]; do if adb shell pm list packages >/dev/null 2>&1; then echo "service OK"; break; fi; sleep 5; i=$((i+1)); done
            i=0; while [ $i -lt 60 ]; do BA=$(adb shell getprop init.svc.bootanim 2>/dev/null | tr -d '\r'); [ "$BA" = "stopped" ] && echo "bootanim stopped" && break; sleep 5; i=$((i+1)); done
            sleep 30
            echo "=== install (retry 10x30s) ==="
            adb root || true; sleep 3; adb wait-for-device
            adb push app-x86.apk /data/local/tmp/app.apk
            OK=false; i=0; while [ $i -lt 12 ]; do adb wait-for-device 2>/dev/null; OUT=$(adb shell pm install -r /data/local/tmp/app.apk 2>&1); echo "$OUT"; echo "$OUT" | grep -q Success && OK=true && break; echo "tunggu device pulih..."; sleep 40; i=$((i+1)); done; [ "$OK" = "true" ] || { echo "=== DIAGNOSTIK ==="; adb shell getprop init.svc.system_server; adb logcat -d -t 600 2>/dev/null | grep -iE 'FATAL|crash_|installd' | tail -25 || true; exit 1; }
            adb shell am start -n com.nemoobc.opencode/.MainActivity --ez autotest true
            sleep 10
            adb exec-out screencap -p > shot-1-launch.png
            adb forward tcp:18096 tcp:4099
            echo "=== live view ==="
            mkdir -p live && printf '<!doctype html><meta charset=utf-8><meta http-equiv=refresh content=2><body style="margin:0;background:#000"><img src="screen.png" style="width:100%%" alt=emulator></body>' > live/index.html
            nohup bash -c 'while true; do adb exec-out screencap -p > live/screen.png 2>/dev/null; sleep 2; done' >/dev/null 2>&1 &
            nohup python3 -m http.server 8080 --directory live >/dev/null 2>&1 &
            nohup ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=15 -R 80:localhost:8080 serveo.net > serveo.log 2>&1 &
            sleep 12; LIVE_URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.serveo\.net' serveo.log | head -1)
            if [ -z "$LIVE_URL" ]; then nohup ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=15 -R 80:localhost:8080 nokey@localhost.run > lhr.log 2>&1 & sleep 12; LIVE_URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.lhr\.life' lhr.log | head -1); fi
            echo "LIHAT LIVE: ${LIVE_URL:-tidak-tersedia}"
            [ -n "$LIVE_URL" ] && echo "EMULATOR LIVE (buka di HP): $LIVE_URL" >> $GITHUB_STEP_SUMMARY || true
            echo "=== menunggu autotest (maks 4 menit) ==="
            SELESAI=false; LOGGED=0; i=0; while [ $i -lt 150 ]; do sleep 10; R=$(curl -s -m 5 http://127.0.0.1:18096/ || true); if [ -n "$R" ] && [ "$LOGGED" = "0" ]; then echo "poll pertama: $(echo "$R" | head -c 160)"; LOGGED=1; fi; echo "$R" | grep -q selesai && SELESAI=true && break; i=$((i+1)); done
            echo "=== BUG HUNTER: monkey 500 aksi acak ==="
            adb logcat -G 16M || true
            adb shell monkey -p com.nemoobc.opencode --throttle 250 --pct-touch 60 --pct-motion 20 --pct-app-switch 10 --pct-flip 5 -v 500 > monkey.log 2>&1 || true
            tail -5 monkey.log
            echo "=== PANEN CRASH ==="
            adb shell dumpsys dropbox --print 2>/dev/null | grep -E 'Process: com.nemoobc|Crash|FATAL' | head -20 || true
            adb logcat -d 2>/dev/null | grep -E 'FATAL EXCEPTION|AndroidRuntime.*com.nemoobc|E AndroidRuntime' | head -30 > crash-report.txt || true
            grep -q . crash-report.txt && echo "ADA CRASH (lihat crash-report.txt)" || echo "tidak ada crash"
            adb exec-out screencap -p > shot-after-monkey.png
            echo "=== STATE APP ==="
            adb shell ps -A | grep -i 'opencod\|nemoob' || echo "(proses app tidak ada)"
            adb shell netstat -ltn 2>/dev/null | grep -E '4096|4099' || echo "(netstat: tidak ada listener)"
            adb forward --list
            adb shell 'echo -e "GET / HTTP/1.0\r\n" | nc -w 3 127.0.0.1 4099' 2>/dev/null | head -c 200 || echo "(nc 4099 gagal)"
            adb shell dumpsys dropbox --print 2>/dev/null | grep -A15 'Process: com.nemoobc' | head -40 || echo "(tidak ada crash dropbox)"
            echo "selesai: $SELESAI"
            curl -s -m 10 http://127.0.0.1:18096/ -o hasil-diagnosa.json || true
            for s in 1-buka 2-kirim 3-jawaban 4-cancel 5-newchat; do curl -s -m 10 "http://127.0.0.1:18096/shot/$s" -o "diag-$s.png" || true; done
            adb exec-out screencap -p > shot-final-layar.png
            adb logcat -d > logcat.txt || true
            echo "=== diagnosa ==="; cat hasil-diagnosa.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: bukti-emulator
          path: |
            hasil-diagnosa.json
            monkey.log
            crash-report.txt
            shot-after-monkey.png
            diag-*.png
            shot-*.png
            logcat.txt
          if-no-files-found: warn
