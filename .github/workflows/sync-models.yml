name: sync-models

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ambil daftar model gratis dari relay opencode
        id: sync
        run: |
          python3 - <<'PY'
          import json, urllib.request, re, subprocess

          URL = "https://opencode.ai/zen/v1/models"
          FPATH = "assets/ui/js/models.js"
          START = "/* AUTO-MODELS-START */"
          END = "/* AUTO-MODELS-END */"

          with urllib.request.urlopen(urllib.request.Request(
                  URL, headers={"User-Agent": "opencode-android (sync-models; +https://github.com/nemoobc/opencode-android)"}),
                  timeout=20) as r:
              data = json.load(r)
          ids = [m["id"] for m in data.get("data", [])]

          # hanya model gratis resmi (akhiran -free)
          free_ids = [i for i in ids if i.endswith("-free")]
          free_ids = list(dict.fromkeys(free_ids))  # dedupe urut stabil

          # nama tampilan ramah untuk id yang dikenal (sisanya prettify otomatis)
          NAMES = {
              "ling-3.0-flash-fin-free": "Ling 3.0 Flash",
              "nemotron-3.5-lightning-free": "Nemotron Lightning",
              "mimo-v2.5-free": "Mimo 2.5 Free",
              "muse-spark-1.3-contributor-free": "Muse Spark 1.3",
              "muse-spark-1.2-contributor-free": "Muse Spark 1.2",
              "nemotron-3-ultra-free": "Nemotron 3 Ultra",
              "deepseek-v4-flash-free": "DeepSeek V4 Flash",
              "laguna-s-2.1-free": "Laguna S 2.1",
          }

          def nice_name(i):
              if i in NAMES:
                  return NAMES[i]
              base = re.sub(r"-free$", "", i)
              return " ".join(w.capitalize() for w in base.split("-"))

          # urutan: mimo default dulu, sisanya urut abjad
          ordered = (["mimo-v2.5-free"] if "mimo-v2.5-free" in free_ids else []) + \
                    sorted([i for i in free_ids if i != "mimo-v2.5-free"])

          lines = []
          for i in ordered:
              lines.append("  {id:'opencode/%s',  nm:'%s',  ds:'Katalog Resmi Relay', tag:'GRATIS'},"
                           % (i, nice_name(i)))
          # model PRO tetap (butuh api key) — workflow khusus FREE tidak mengubah ini
          lines += [
              "  {id:'anthropic/claude-sonnet-4', nm:'Claude Sonnet 4', ds:'Butuh API Key Anthropic', tag:'PRO'},",
              "  {id:'openai/gpt-4.1',            nm:'GPT-4.1',         ds:'Butuh API Key OpenAI',    tag:'PRO'}",
          ]

          block = "var MODELS = [\n" + "\n".join(lines) + "\n];\n"

          src = open(FPATH, encoding="utf-8").read()
          a = src.index(START)
          b = src.index(END)
          code_prefixes = ("{id:", "var MODELS")
          header = "\n".join([line for line in src[a:b].splitlines()
                               if not (line.strip().startswith(code_prefixes) or line.strip() == "];")])
          new_src = src[:a] + header.rstrip() + "\n" + block + src[b:]

          if new_src == src:
              print("tidak-ada-perubahan")
          else:
              open(FPATH, "w", encoding="utf-8").write(new_src)
              # validasi: models.js harus tetap JS valid
              try:
                  subprocess.run(["node", "--check", FPATH], check=True, capture_output=True)
              except Exception as ex:
                  print("VALIDASI GAGAL:", ex)
                  raise SystemExit(1)
              print("diperbarui")
              print("jumlah-model-gratis:", len(ordered))
          PY

      - name: commit & push + tanda perubahan
        id: commit
        run: |
          if git diff --quiet -- assets/ui/js/models.js; then
            echo "tidak ada perubahan — selesai."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "nemoobc"
            git config user.email "258114617+nemoobc@users.noreply.github.com"
            git add assets/ui/js/models.js
            git commit -m "chore(model): sync daftar model gratis dari relay opencode"
            git push
            echo "commit & push selesai (author: nemoobc)."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
